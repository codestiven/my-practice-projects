<!DOCTYPE html>
<html>

<head>
    <title>Tabla de multiplicar</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        .container {
            max-width: 400px;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <h1>Generador de Tablas de Multiplicar</h1>
        <div class="form-group">
            <label for="valor">Selecciona un valor del 1 al 10:</label>
            <select class="form-control" id="valor">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="generarTabla()">Generar Tabla</button>
    </div>

    <div class="container mt-4">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Número</th>
                    <th scope="col">Resultado</th>
                </tr>
            </thead>
            <tbody id="tablaBody">
            </tbody>
        </table>
    </div>

    <script>
        function generarTabla() {
            var valor = parseInt(document.getElementById('valor').value);
            var tablaBody = document.getElementById('tablaBody');
            tablaBody.innerHTML = '';

            for (var i = 1; i <= 12; i++) {
                var fila = document.createElement('tr');
                var numeroColumna = document.createElement('td');
                var resultadoColumna = document.createElement('td');

                numeroColumna.textContent = valor + ' x ' + i;
                resultadoColumna.textContent = valor * i;

                fila.appendChild(numeroColumna);
                fila.appendChild(resultadoColumna);

                tablaBody.appendChild(fila);
            }
        }
    </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
</body>

</html>
